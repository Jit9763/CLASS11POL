<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नोट्स - प्रीमियम HTML व्यू</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            overflow-x: auto !important;
        }
        .container { width: 100%; min-height: 100vh; padding: 0 0 40px 0 !important; background-color: #f8fafc; position: relative; }
        .page-container { width: var(--container-width, 1400px); max-width: none !important; margin: 0 auto; padding: 85px 10px 40px 10px !important; box-sizing: border-box; }
        #notes-content > div {
            width: 100% !important;
            max-width: 100% !important;
        }
        .nav-back {
            margin-bottom: 20px;
            display: inline-block;
            color: #3b82f6;
            text-decoration: none;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 100px;
            font-size: 1.5rem;
            color: #1e293b;
        }

        #notes-content .adjustable-text {
            font-size: max(2px, calc(var(--orig-size) + var(--size-offset, 0px))) !important;
            font-weight: calc(var(--orig-weight) + var(--weight-offset, 0)) !important;
            -webkit-text-stroke-width: max(0px, calc(var(--orig-stroke, 0px) + var(--stroke-offset, 0px))) !important;
            -webkit-text-stroke-color: #000000 !important;
        }

        /* Action Bar styling matching political-science */
        .action-bar { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; gap: 8px; background: rgba(15, 23, 42, 0.95); padding: 8px 14px; border-radius: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .action-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: #334155; color: white; font-size: 1.7rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .action-btn:hover {
            transform: scale(1.05);
            background: #3b82f6;
            color: white;
        }

        /* Print Styles to ensure PDF is PERFECT on A4 */
        @page {
            margin: 10mm;
            size: A4;
        }
        @media print {
            .bg-animation, .action-bar, .floating-home-btn, .nav-back { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .page-container { width: var(--container-width, 1400px); max-width: none !important; margin: 0 auto; padding: 85px 10px 40px 10px !important; box-sizing: border-box; }
            .master-container { width: 100% !important; margin: 0 !important; padding: 10mm !important; border: none !important; box-shadow: none !important; background-color: white !important; }
            .section-divider { page-break-after: avoid; }
            #notes-content > div { width: 100% !important; max-width: none !important; margin: 0 !important; padding: 10mm !important; }
        }
    
        body {
            overflow-x: auto !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        .container {
            max-width: none !important;
            width: fit-content !important;
            min-width: 100% !important;
            margin: 0 auto !important;
            padding: 0 0 40px 0 !important;
        }
        .page-container {
            width: var(--container-width, 1400px) !important;
            max-width: none !important;
            margin: 40px auto !important;
            background: white !important;
            color: #1a202c !important;
            padding: 85px 10px 15px 10px !important;
            border-radius: 20px !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4) !important;
            box-sizing: border-box !important;
        }
        #notes-content > div,
        #notes-content [class*="-content"],
        #notes-content .master-container,
        #notes-content .preview {
            padding-left: 0px !important;
            padding-right: 0px !important;
        }
        .action-bar {
            position: absolute !important;
            top: 15px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            display: flex !important;
            gap: 12px !important;
            z-index: 1100 !important;
            flex-wrap: wrap !important;
            justify-content: center !important;
            max-width: calc(100% - 30px) !important;
            width: fit-content !important;
        }
        .action-btn {
            width: 60px !important;
            height: 60px !important;
            border-radius: 14px !important;
            border: 2.5px solid #3b82f6 !important;
            background: #1e293b !important;
            color: white !important;
            font-size: 1.7rem !important;
            font-weight: 700 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            cursor: pointer !important;
            transition: all 0.2s ease-in-out !important;
            box-shadow: 0 6px 18px rgba(0,0,0,0.35) !important;
        }
        .action-btn:hover {
            transform: scale(1.12) !important;
            background: #3b82f6 !important;
            box-shadow: 0 8px 22px rgba(59, 130, 246, 0.5) !important;
        }

    
        /* Hide old double blue border title wrapper box */
        #notes-content div[style*="double"],
        #notes-content div[style*="1e3a8a"],
        #notes-content div[style*="eff6ff"] {
            border: none !important;
            background: transparent !important;
            background-color: transparent !important;
            padding: 0 !important;
            box-shadow: none !important;
            margin-bottom: 30px !important;
        }

    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="container" style="position: relative;">
        <!-- Action Bar at TOP RIGHT -->
        <div class="action-bar">
            <button class="action-btn" onclick="adjustWidth(40)" title="Increase Page Width">W+</button>
            <button class="action-btn" onclick="adjustWidth(-40)" title="Decrease Page Width">W-</button>
            <button class="action-btn" onclick="adjustFontSize(2)" title="Increase Font Size">A+</button>
            <button class="action-btn" onclick="adjustFontSize(-2)" title="Decrease Font Size">A-</button>
            <button class="action-btn" onclick="adjustFontWeight(100)" title="Increase Text Boldness">B+</button>
            <button class="action-btn" onclick="adjustFontWeight(-100)" title="Decrease Text Boldness">B-</button>
            <button id="copyBtn" class="action-btn" onclick="copyEntireContent()" title="Copy Formatting">📋</button>
            <button id="pdfBtn" class="action-btn" onclick="generatePDF()" title="Download PDF or Print">📥</button>
        </div>
        
        <!-- Floating Home Button -->
        <a href="index.html" class="floating-home-btn" style="position: fixed; bottom: 30px; left: 30px; z-index: 1000; background: #1e293b; color: white; padding: 15px; border-radius: 50%; text-decoration: none; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border: 2px solid #3b82f6; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; width: 65px; height: 65px;">🏠</a>
        
        <div class="page-container">
            <div id="notes-content">
                <div class="loading">नोट्स लोड हो रहे हैं... (शामिल हैं 50 पन्ने)</div>
            </div>
        </div>
    </div>

    <script>
        let containerWidth = 1400; // default width in pixels
        let sizeOffset = 0;
        let weightOffset = 0;
        let strokeOffset = 0;

        function adjustWidth(amount) {
            containerWidth += amount;
            if (containerWidth < 400) containerWidth = 400;
            if (containerWidth > 6000) containerWidth = 6000;
            const container = document.querySelector('.page-container');
            if (container) {
                container.style.maxWidth = 'none';
                container.style.setProperty('width', containerWidth + 'px', 'important');
                container.style.setProperty('--container-width', containerWidth + 'px');
            }
        }

        function adjustFontSize(amount) {
            sizeOffset += amount;
            if (sizeOffset < -50) sizeOffset = -50;
            if (sizeOffset > 60) sizeOffset = 60;
            const container = document.getElementById('notes-content');
            if (container) {
                container.style.setProperty('--size-offset', sizeOffset + 'px');
            }
        }

        function adjustFontWeight(amount) {
            weightOffset += amount;
            if (weightOffset < -600) weightOffset = -600;
            if (weightOffset > 800) weightOffset = 800;
            
            strokeOffset += (amount / 100) * 0.4;
            if (strokeOffset < -3.0) strokeOffset = -3.0;
            if (strokeOffset > 5.0) strokeOffset = 5.0;
            
            const container = document.getElementById('notes-content');
            if (container) {
                container.style.setProperty('--weight-offset', weightOffset);
                container.style.setProperty('--stroke-offset', strokeOffset + 'px');
            }
        }

        function initTextFormatting(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const elements = container.querySelectorAll('*');
            elements.forEach(el => {
                const tagName = el.tagName.toLowerCase();
                if (['script', 'style', 'img', 'br', 'hr'].includes(tagName)) return;
                
                const style = window.getComputedStyle(el);
                const fontSize = style.fontSize;
                const fontWeight = style.fontWeight;
                const strokeWidth = style.webkitTextStrokeWidth;
                
                if (fontSize) {
                    el.style.setProperty('--orig-size', fontSize);
                }
                if (fontWeight) {
                    let weightVal = fontWeight;
                    if (fontWeight === 'normal') weightVal = '400';
                    else if (fontWeight === 'bold') weightVal = '700';
                    el.style.setProperty('--orig-weight', weightVal);
                }
                if (strokeWidth && strokeWidth !== '0px' && strokeWidth !== '') {
                    el.style.setProperty('--orig-stroke', strokeWidth);
                }
                el.classList.add('adjustable-text');
            });
        }

        async function copyEntireContent() {
            const btn = document.getElementById('copyBtn');
            const target = document.getElementById('notes-content');
            if (!target) return;

            // Clone target to clean up style-offset variables before copying
            const clone = target.cloneNode(true);
            const adjustableElements = clone.querySelectorAll('.adjustable-text');
            adjustableElements.forEach(el => {
                // Remove dynamic scaling class
                el.classList.remove('adjustable-text');
                
                // Read inline styles if any, clean up CSS variables
                const styleAttr = el.getAttribute('style') || '';
                let cleanedStyle = styleAttr
                    .replace(/--orig-size:[^;]+;?/g, '')
                    .replace(/--orig-weight:[^;]+;?/g, '')
                    .replace(/--orig-stroke:[^;]+;?/g, '')
                    .replace(/--size-offset:[^;]+;?/g, '')
                    .replace(/--weight-offset:[^;]+;?/g, '')
                    .replace(/--stroke-offset:[^;]+;?/g, '')
                    .trim();
                
                if (cleanedStyle === '') {
                    el.removeAttribute('style');
                } else {
                    el.setAttribute('style', cleanedStyle);
                }
            });

            // Get styles to bundle
            const styles = Array.from(document.querySelectorAll('style'))
                .map(s => s.innerHTML)
                .join('\n');

            const richHTML = `<!DOCTYPE html><html><head><style>${styles}</style></head>
            <body><div class="master-container" style="padding: 20px;">${clone.innerHTML}</div></body></html>`;

            try {
                const blob = new Blob([richHTML], { type: 'text/html' });
                const item = new ClipboardItem({ 'text/html': blob });
                await navigator.clipboard.write([item]);
                
                btn.innerText = '✅';
                setTimeout(() => btn.innerText = '📋', 2000);
            } catch (err) {
                alert('Copy failed: ' + err);
            }
        }

        function generatePDF() {
            window.print();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (id && parseInt(id) >= 1 && parseInt(id) <= 18) {
                try {
                    const response = await fetch(`copy_master_ch${id}.html?v=${new Date().getTime()}`);
                    if (!response.ok) throw new Error('File not found');
                    
                    const html = await response.text();
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // Extract styles
                    const styles = doc.querySelectorAll('style');
                    styles.forEach(style => {
                        document.head.appendChild(style.cloneNode(true));
                    });

                    // Extract content
                    const content = doc.getElementById('contentToCopy');
                    if (content) {
                        document.getElementById('notes-content').innerHTML = content.innerHTML;
                        document.title = "नोट्स - चैप्टर " + id;
                        
                        // Initialize font scaling controls on contents
                        initTextFormatting('notes-content');
                    } else {
                        document.getElementById('notes-content').innerHTML = "<p>त्रुटि: नोट्स प्राप्त नहीं हो सके।</p>";
                    }
                } catch (err) {
                    document.getElementById('notes-content').innerHTML = `<p>त्रुटि: चैप्टर ${id} के नोट्स अभी उपलब्ध नहीं हैं।</p>`;
                }
            } else {
                document.getElementById('notes-content').innerHTML = "<h3>चैप्टर " + (id || "") + " के लिए नोट्स जल्द ही आ रहे हैं!</h3>";
            }
        });
    
        document.addEventListener('keydown', (e) => {
            if (e.key === 'w' || e.key === 'W' || e.key === '+' || e.key === '-') {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === 'w' && !e.shiftKey || e.key === '-') {
                    adjustWidth(-100);
                } else if (e.key === 'W' || (e.key === 'w' && e.shiftKey) || e.key === '+') {
                    adjustWidth(100);
                }
            }
        });
        
    </script>
</body>
</html>
