<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A - प्रीमियम HTML व्यू</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .page-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
            background: transparent;
        }
        .nav-back {
            margin-bottom: 20px;
            display: inline-block;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 100px;
            font-size: 1.5rem;
            color: white;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="container" style="position: relative; width: 100%;">
        <!-- Floating Home Button -->
        <a href="index.html" class="floating-home-btn" style="position: fixed; bottom: 30px; left: 30px; z-index: 1000; background: #1e293b; color: white; padding: 15px; border-radius: 50%; text-decoration: none; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border: 2px solid #059669; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; width: 65px; height: 65px;">🏠</a>
        
        <div class="page-container">
            <!-- Copy Button Fixed at the Top (Widened for the new layout) -->
            <button id="floatingCopyBtn" class="premium-copy-btn" onclick="copyEntireContent()" style="max-width: 1250px; margin: 0 auto 30px auto; background: #059669; color: white; padding: 20px; border: none; border-radius: 12px; font-size: 2rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #047857; display: block; width: 100%;">
                📋
            </button>

            <div id="notes-content">
                <div class="loading">Q&A लोड हो रहे हैं... (20+ प्रश्न)</div>
            </div>
        </div>
    </div>

    <script>
        async function copyEntireContent() {
            const btn = document.getElementById('floatingCopyBtn');
            const target = document.getElementById('notes-content');
            
            // Clone the content to modify it for copying
            const clone = target.cloneNode(true);
            
            // CRITICAL: Convert all relative image paths to Absolute URLs
            // This ensures Google Docs can find the images on your public GitHub Pages
            const images = clone.querySelectorAll('img');
            images.forEach(img => {
                // img.src in JS automatically returns the full absolute URL
                img.setAttribute('src', img.src);
            });

            const content = clone.innerHTML;
            
            try {
                // Ensure images use absolute URLs for docs sync
                const blob = new Blob([content], { type: 'text/html' });
                const item = new ClipboardItem({ 'text/html': blob });
                await navigator.clipboard.write([item]);
                
                btn.innerText = '✅';
                btn.style.background = '#047857';
                
                setTimeout(() => {
                    btn.innerText = '📋';
                    btn.style.background = '#059669';
                }, 3000);
            } catch (err) {
                alert('Copy failed: ' + err);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (id && parseInt(id) >= 1 && parseInt(id) <= 20) {
                try {
                    // Added versioning to bypass browser cache and show the latest changes
                    const response = await fetch(`qa_master_ch${id}.html?v=${new Date().getTime()}`);
                    if (!response.ok) throw new Error('File not found');
                    
                    const html = await response.text();
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // 1. Extract and inject styles from the fetched chapter
                    const styles = doc.querySelectorAll('style');
                    styles.forEach(style => {
                        document.head.appendChild(style.cloneNode(true));
                    });

                    // 2. Extract and inject the content
                    const content = doc.getElementById('contentToCopy');
                    if (content) {
                        document.getElementById('notes-content').innerHTML = content.innerHTML;
                        document.title = "Q&A - चैप्टर " + id;
                    } else {
                        document.getElementById('notes-content').innerHTML = "<p>त्रुटि: Q&A प्राप्त नहीं हो सके।</p>";
                    }
                } catch (err) {
                    document.getElementById('notes-content').innerHTML = `<p>त्रुटि: चैप्टर ${id} के Q&A अभी उपलब्ध नहीं हैं।</p>`;
                }
            } else {
                document.getElementById('notes-content').innerHTML = "<h3>चैप्टर " + (id || "") + " के लिए Q&A व्यू जल्द ही आ रहा है!</h3><p>कृपया अभी के लिए अन्य चैप्टर्स को आज़माएँ।</p>";
            }
        });
    </script>
</body>
</html>
