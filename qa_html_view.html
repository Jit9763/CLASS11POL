<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A - प्रीमियम HTML व्यू</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .page-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
            background: transparent;
        }
        .nav-back {
            margin-bottom: 20px;
            display: inline-block;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 100px;
            font-size: 1.5rem;
            color: white;
        }
        .action-bar {
            max-width: 1250px;
            margin: 0 auto 30px auto;
            display: flex;
            gap: 15px;
        }
        .premium-btn {
            flex: 1;
            color: white;
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .copy-btn { background: #059669; border: 1px solid #047857; }
        .pdf-btn { background: #be123c; border: 1px solid #9f1239; }
        .premium-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
        .premium-btn:active { transform: translateY(1px); }
    </style>
    <!-- PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="container" style="position: relative; width: 100%;">
        <!-- Floating Home Button -->
        <a href="index.html" class="floating-home-btn" style="position: fixed; bottom: 30px; left: 30px; z-index: 1000; background: #1e293b; color: white; padding: 15px; border-radius: 50%; text-decoration: none; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border: 2px solid #059669; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; width: 65px; height: 65px;">🏠</a>
        
        <div class="page-container">
            <!-- Action Bar: Copy and PDF -->
            <div class="action-bar">
                <button id="floatingCopyBtn" class="premium-btn copy-btn" onclick="copyEntireContent()">
                    📋 कॉपी (Formatting)
                </button>
                <button id="pdfBtn" class="premium-btn pdf-btn" onclick="generatePDF()">
                    📥 डाउनलोड PDF
                </button>
            </div>

            <div id="notes-content">
                <div class="loading">Q&A लोड हो रहे हैं... (20+ प्रश्न)</div>
            </div>
        </div>
    </div>

    <script>
        async function copyEntireContent() {
            const btn = document.getElementById('floatingCopyBtn');
            const target = document.getElementById('notes-content');
            
            // 1. Get ALL active styles from the head
            const allStyles = Array.from(document.querySelectorAll('style'))
                .map(s => s.innerHTML)
                .join('\n');

            // 2. Wrap content with style block for RICH COPY
            const richHTML = `
                <html>
                <head><style>${allStyles}</style></head>
                <body>
                    <div class="master-container" style="padding: 20px; font-family: 'Segoe UI', Tahoma, sans-serif;">
                        ${target.innerHTML}
                    </div>
                </body>
                </html>
            `;

            try {
                const blob = new Blob([richHTML], { type: 'text/html' });
                const item = new ClipboardItem({ 'text/html': blob });
                await navigator.clipboard.write([item]);
                
                const oldText = btn.innerText;
                btn.innerText = '✅ कॉपी सफल!';
                btn.style.background = '#047857';
                
                setTimeout(() => {
                    btn.innerText = oldText;
                    btn.style.background = '#059669';
                }, 3000);
            } catch (err) {
                alert('Copy failed: ' + err);
            }
        }

        function generatePDF() {
            const element = document.getElementById('notes-content');
            const chapterId = new URLSearchParams(window.location.search).get('id') || 'Chapter';
            const opt = {
                margin:       [10, 10],
                filename:     `Political_Science_Ch_${chapterId}_2026_27.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            const btn = document.getElementById('pdfBtn');
            btn.innerText = '⏳ जनरेट हो रहा है...';
            
            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerText = '📥 डाउनलोड PDF';
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (id && parseInt(id) >= 1 && parseInt(id) <= 20) {
                try {
                    const response = await fetch(`qa_master_ch${id}.html?v=${new Date().getTime()}`);
                    if (!response.ok) throw new Error('File not found');
                    
                    const html = await response.text();
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // 1. Extract and inject styles from the fetched chapter
                    const styles = doc.querySelectorAll('style');
                    styles.forEach(style => {
                        document.head.appendChild(style.cloneNode(true));
                    });

                    // 2. Extract and inject the content
                    const content = doc.getElementById('contentToCopy');
                    if (content) {
                        document.getElementById('notes-content').innerHTML = content.innerHTML;
                        document.title = "Q&A - चैप्टर " + id;
                    } else {
                        document.getElementById('notes-content').innerHTML = "<p>त्रुटि: Q&A प्राप्त नहीं हो सके।</p>";
                    }
                } catch (err) {
                    document.getElementById('notes-content').innerHTML = `<p>त्रुटि: चैप्टर ${id} के Q&A अभी उपलब्ध नहीं हैं।</p>`;
                }
            } else {
                document.getElementById('notes-content').innerHTML = "<h3>चैप्टर " + (id || "") + " के लिए Q&A व्यू जल्द ही आ रहा है!</h3><p>कृपया अभी के लिए अन्य चैप्टर्स को आज़माएँ।</p>";
            }
        });
    </script>
</body>
</html>
